name: Fast HTML Render (Portrait 1080x1920, 25s, 60fps)

on:
  workflow_dispatch:
  push:
    paths:
      - 'inputs/**'
      - '.github/workflows/fast-render.yml'

# Allows the workflow to save small MP4 files back into the repository.
permissions:
  contents: write

jobs:
  render:
    # Windows provides the original Windows font families, including Tahoma.
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Verify original Windows fonts are available
        shell: pwsh
        run: |
          $fontDirectory = Join-Path $env:WINDIR 'Fonts'
          $requiredFonts = @{
            'Tahoma' = Join-Path $fontDirectory 'tahoma.ttf'
            'Arial' = Join-Path $fontDirectory 'arial.ttf'
            'Trebuchet MS' = Join-Path $fontDirectory 'trebuc.ttf'
          }
          $missingFonts = @()
          foreach ($fontName in $requiredFonts.Keys) {
            $fontPath = $requiredFonts[$fontName]
            if (Test-Path $fontPath) {
              Write-Host "FOUND: $fontName ($fontPath)"
            } else {
              Write-Host "MISSING: $fontName ($fontPath)"
              $missingFonts += $fontName
            }
          }
          if ($missingFonts.Count -gt 0) {
            throw "Required font file(s) were not found: $($missingFonts -join ', '). Stopping instead of silently rendering with substitute fonts."
          }
          $boldFonts = @{
            'Tahoma Bold' = Join-Path $fontDirectory 'tahomabd.ttf'
            'Arial Bold' = Join-Path $fontDirectory 'arialbd.ttf'
          }
          foreach ($fontName in $boldFonts.Keys) {
            if (Test-Path $boldFonts[$fontName]) {
              Write-Host "FOUND: $fontName ($($boldFonts[$fontName]))"
            } else {
              Write-Warning "Optional bold face not found: $fontName. Chromium may synthesize bold text."
            }
          }

      - name: Install timecut
        shell: pwsh
        run: |
          npm install --global timecut
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install timecut.' }
          timecut --version
          if ($LASTEXITCODE -ne 0) { throw 'timecut could not be started.' }

      - name: Create output folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'output' | Out-Null

      - name: Render all HTML files (25 seconds, 60 fps, portrait)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $htmlFiles = @(Get-ChildItem -Path 'inputs' -Filter '*.html' -File -ErrorAction SilentlyContinue)
          if ($htmlFiles.Count -eq 0) {
            $htmlFiles = @(Get-ChildItem -Path '.' -Filter '*.html' -File -ErrorAction SilentlyContinue)
          }
          if ($htmlFiles.Count -eq 0) {
            throw 'No HTML files found in inputs/ or the repository root.'
          }

          Write-Host "Found $($htmlFiles.Count) HTML file(s)."
          foreach ($htmlFile in $htmlFiles) {
            $outputDirectory = (Resolve-Path 'output').Path
            $outputPath = Join-Path $outputDirectory ($htmlFile.BaseName + '.mp4')
            Write-Host '========================================'
            Write-Host "Rendering: $($htmlFile.FullName)"
            Write-Host "Output: $outputPath"
            Write-Host 'Canvas: 1080x1920 | Duration: 25s | FPS: 60'
            Write-Host '========================================'

            $timecutArgs = @(
              $htmlFile.FullName,
              "--output=$outputPath",
              '--viewport=1080,1920',
              '--fps=60',
              '--duration=25',
              '--start-delay=1',
              '--pix-fmt=yuv420p'
            )
            & timecut @timecutArgs
            if ($LASTEXITCODE -ne 0) {
              throw "timecut failed for '$($htmlFile.Name)' with exit code $LASTEXITCODE."
            }
            if (-not (Test-Path $outputPath)) {
              throw "Expected output was not created: $outputPath"
            }
          }

      - name: Verify video dimensions, frame rate, and duration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $videos = @(Get-ChildItem -Path 'output' -Filter '*.mp4' -File)
          if ($videos.Count -eq 0) { throw 'No MP4 files were created.' }

          foreach ($video in $videos) {
            $probeOutput = & ffprobe -v error -count_frames -select_streams v:0 `
              -show_entries 'stream=width,height,r_frame_rate,nb_read_frames:format=duration' `
              -of json $video.FullName
            if ($LASTEXITCODE -ne 0) { throw "ffprobe failed for '$($video.Name)'." }
            $info = ($probeOutput -join "`n") | ConvertFrom-Json
            $stream = $info.streams[0]
            $duration = [double]::Parse([string]$info.format.duration, [Globalization.CultureInfo]::InvariantCulture)
            $rateParts = ([string]$stream.r_frame_rate).Split('/')
            $fps = [double]$rateParts[0] / [double]$rateParts[1]

            Write-Host ("{0}: {1}x{2}, {3:N3} fps, {4:N3} seconds, {5} frames" -f `
              $video.Name, $stream.width, $stream.height, $fps, $duration, $stream.nb_read_frames)

            if ($stream.width -ne 1080 -or $stream.height -ne 1920) {
              throw "Unexpected video size for '$($video.Name)': $($stream.width)x$($stream.height). Expected 1080x1920."
            }
            if ([Math]::Abs($fps - 60) -gt 0.1) {
              throw "Unexpected frame rate for '$($video.Name)': $fps. Expected 60 fps."
            }
            if ([Math]::Abs($duration - 25) -gt 0.5) {
              throw "Unexpected duration for '$($video.Name)': $duration seconds. Expected 25 seconds."
            }
          }

      # An artifact is available even if committing the MP4 back to the repo is blocked.
      - name: Upload rendered videos as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos-1080x1920-25s-60fps
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Commit MP4 files to repository when small enough
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -notlike 'refs/heads/*') {
            Write-Host 'This run is not on a branch; MP4 files are available as an artifact only.'
            exit 0
          }

          # Stay below GitHub's 100 MiB per-file repository limit.
          $maxBytes = 95 * 1024 * 1024
          $videos = @(Get-ChildItem -Path 'output' -Filter '*.mp4' -File)
          foreach ($video in $videos) {
            if ($video.Length -ge $maxBytes) {
              Write-Warning "Not committing $($video.Name): it is larger than 95 MiB. It is still available as a workflow artifact."
              continue
            }
            $relativePath = ([System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $video.FullName)).Replace('\', '/')
            git add -f -- $relativePath
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not stage $relativePath; the workflow artifact is still available."
              exit 0
            }
          }

          $stagedFiles = @(git diff --cached --name-only -- 'output/')
          if ($stagedFiles.Count -eq 0) {
            Write-Host 'No eligible new or changed MP4 files to commit.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add rendered MP4 output'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Could not commit the rendered MP4 files. They are still available as a workflow artifact.'
            exit 0
          }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Could not push the MP4 commit. Check branch protection and Actions write permissions; the artifact is still available.'
            exit 0
          }
          Write-Host 'Rendered MP4 file(s) committed to the repository.'
