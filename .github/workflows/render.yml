# ============================================================================
#  PASTE THIS FILE AS:  .github/workflows/render.yml
#
#  GitHub web UI → repo → "Add file" → "Create new file" →
#  type exactly:  .github/workflows/render.yml   → paste this → Commit.
#
#  (The .github folder is hidden on your computer, which is why drag-and-drop
#   upload skipped it. Creating the path by hand works every time.)
# ============================================================================
name: Render HTML → MP4 (1080x1920 · 60fps · 25s)

# Upload an .html file to inputs/ → get <name>.mp4 in Releases + Artifacts.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Render only these files (comma separated, e.g. 1). Empty = all."
        required: false
        default: ""
      publish_release:
        description: "Attach the MP4s to a GitHub Release"
        type: boolean
        default: true
  push:
    paths:
      - "inputs/**"
      - "public/scenes/**"
      - "src/**"
      - "scripts/**"
      - "video.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  # 1 ─ Find the HTML files once, then fan out: 1 file = 1 parallel runner.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      publish: ${{ steps.flags.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # inputs/ is your upload folder. Remotion can only serve files from
      # public/, so mirror inputs/ → public/scenes/ (never commits anything).
      - name: Mirror inputs/ → public/scenes/
        run: |
          mkdir -p public/scenes
          if compgen -G "inputs/**/*.html" > /dev/null || compgen -G "inputs/*.html" > /dev/null; then
            cp -r inputs/. public/scenes/
            rm -rf public/scenes/audio
            # If you upload real files, the sample demo.html is dropped so you
            # get exactly one video per uploaded file.
            rm -f public/scenes/demo.html
          fi
          if [ -d inputs/audio ]; then
