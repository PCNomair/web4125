name: Render HTML to MP4

on:
  workflow_dispatch: # يتيح لك تشغيل التحويل بضغطة زر
  push:
    paths:
      - 'inputs/**'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install -g timecut

      - name: Create Output Folder
        run: mkdir -p output

      - name: Render All HTML Files
        run: |
          for f in inputs/*.html; do
            [ -e "$f" ] || continue
            filename=$(basename "$f" .html)
            echo "جاري تحويل: $filename"
            timecut "$f" --output="output/${filename}.mp4" --viewport=1920,1080 --fps=60 --duration=10
          done

      - name: Upload Rendered Videos
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos-1080p
          path: output/*.mp4
