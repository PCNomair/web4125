name: Render HTML + React TSX → MP4

# ضع ملف .html أو .tsx داخل inputs/ → تحصل على MP4 في Releases + Artifacts.
on:
  workflow_dispatch:
  push:
    paths:
      - "inputs/**"
      - "fonts/**"
      - "src/**"
      - "scripts/**"
      - "video.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Browser libraries & fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64 libfontconfig1 \
            fonts-liberation fonts-dejavu-core fonts-noto-core || true

      - name: Cache headless browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure headless browser
        run: npx remotion browser ensure

      - name: Render all HTML and TSX inputs
        env:
          OVERWRITE: "1"
        run: npm run render

      - name: Rename scene-*.mp4 → <name>.mp4
        run: |
          shopt -s nullglob
          for f in out/scene-*.mp4; do
            mv -v "$f" "out/${f#out/scene-}"
          done
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Verify size / fps / duration / motion
        run: node scripts/verify-output.mjs out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="render-${GITHUB_RUN_NUMBER}"
          {
            echo "Rendered from \`${GITHUB_SHA:0:7}\`."
            echo ""
            echo "**1080 × 1920 · 60 fps · 25 s · H.264**"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in out/*.mp4; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } > notes.md
          gh release create "$TAG" out/*.mp4 --title "Rendered videos $TAG" --notes-file notes.md --target "$GITHUB_SHA" \
            || gh release upload "$TAG" out/*.mp4 --clobber
