name: Render HTML → MP4

# ارفع ملف .html إلى inputs/ → تحصل على 1.mp4 في Releases + Artifacts.
on:
  workflow_dispatch:
  push:
    paths:
      - "inputs/**"
      - "fonts/**"
      - "src/**"
      - "scripts/**"
      - "video.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Browser libraries & fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64 libfontconfig1 \
            fonts-liberation fonts-dejavu-core fonts-noto-core || true

      - name: Cache headless browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure headless browser
        run: npx remotion browser ensure

      # Remotion can only serve files from public/, so mirror the upload folder.
      - name: Mirror inputs/ → public/scenes/
        run: |
          mkdir -p public/scenes
          if [ -n "$(find inputs -name '*.html' -print -quit 2>/dev/null)" ]; then
            cp -r inputs/. public/scenes/
            rm -rf public/scenes/audio
            rm -f public/scenes/demo.html
          fi
          if [ -d inputs/audio ]; then
            mkdir -p public/audio
            cp -r inputs/audio/. public/audio/
          fi
          echo "HTML files that will be rendered:"
          find public/scenes -name '*.html' | sort

      - name: Render
        env:
          OVERWRITE: "1"
