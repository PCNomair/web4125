# ============================================================================
#  PASTE THIS FILE AS:  .github/workflows/render.yml
#
#  GitHub web UI → repo → "Add file" → "Create new file" →
#  type exactly:  .github/workflows/render.yml   → paste this → Commit.
#
#  (The .github folder is hidden on your computer, which is why drag-and-drop
#   upload skipped it. Creating the path by hand works every time.)
# ============================================================================
name: Render HTML → MP4 (1080x1920 · 60fps · 25s)

# Upload an .html file to inputs/ → get <name>.mp4 in Releases + Artifacts.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Render only these files (comma separated, e.g. 1). Empty = all."
        required: false
        default: ""
      publish_release:
        description: "Attach the MP4s to a GitHub Release"
        type: boolean
        default: true
  push:
    paths:
      - "inputs/**"
      - "public/scenes/**"
      - "src/**"
      - "scripts/**"
      - "video.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  # 1 ─ Find the HTML files once, then fan out: 1 file = 1 parallel runner.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      publish: ${{ steps.flags.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # inputs/ is your upload folder. Remotion can only serve files from
      # public/, so mirror inputs/ → public/scenes/ (never commits anything).
      - name: Mirror inputs/ → public/scenes/
        run: |
          mkdir -p public/scenes
          if compgen -G "inputs/**/*.html" > /dev/null || compgen -G "inputs/*.html" > /dev/null; then
            cp -r inputs/. public/scenes/
            rm -rf public/scenes/audio
            # If you upload real files, the sample demo.html is dropped so you
            # get exactly one video per uploaded file.
            rm -f public/scenes/demo.html
          fi
          if [ -d inputs/audio ]; then
            mkdir -p public/audio
            cp -r inputs/audio/. public/audio/
          fi
          echo "Scenes on disk:"; find public/scenes -name '*.html' | sort

      - name: Scan scenes
        id: plan
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          npm run scan
          node scripts/plan.mjs --github

      - name: Resolve flags
        id: flags
        env:
          INPUT_PUBLISH: ${{ github.event.inputs.publish_release }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${INPUT_PUBLISH:-true}" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo "### Render plan"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Videos | **${{ steps.plan.outputs.count }}** |"
            echo "| Canvas | 1080 × 1920 (vertical 9:16) |"
            echo "| Frame rate | 60 fps |"
            echo "| Duration | 25 s · 1500 frames |"
            echo "| Renderer | Remotion (deterministic frame capture) |"
            echo ""
            echo '```json'
            echo '${{ steps.plan.outputs.matrix }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 2 ─ One runner per HTML file, in parallel.
  render:
    name: Render ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Chrome + Arabic/Latin fonts (Tahoma/Arial are mapped to metric-compatible
      # Linux fonts by fontconfig, so Arabic shaping stays correct).
      - name: Browser libs & fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64 \
            fonts-liberation fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
          || sudo apt-get install -y -qq --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2 \
            fonts-liberation fonts-dejavu-core fonts-noto-core

      - name: Mirror inputs/ → public/scenes/
        run: |
          mkdir -p public/scenes
          if compgen -G "inputs/**/*.html" > /dev/null || compgen -G "inputs/*.html" > /dev/null; then
            cp -r inputs/. public/scenes/
            rm -rf public/scenes/audio
            rm -f public/scenes/demo.html
          fi
          if [ -d inputs/audio ]; then
            mkdir -p public/audio
            cp -r inputs/audio/. public/audio/
          fi

      # Chrome Headless Shell lives in node_modules/.remotion (wiped by npm ci).
      - name: Cache headless browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure headless browser
        run: npx remotion browser ensure

      - name: Render ${{ matrix.id }}
        env:
          ONLY: ${{ matrix.id }}
          OVERWRITE: "1"
        run: npm run render

      - name: Rename scene-*.mp4 → <name>.mp4
        run: |
          set -e
          shopt -s nullglob
          for f in out/scene-*.mp4; do
            base=$(basename "$f")
            clean=${base#scene-}
            mv -v "$f" "out/$clean"
          done
          echo "--- rendered ---"

      - name: Verify the MP4s
        run: |
          shopt -s nullglob
          found=0
          for f in out/*.mp4; do
            found=1
            echo "== $f ($(du -h "$f" | cut -f1))"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height,r_frame_rate,nb_frames -of default=nw=1 "$f"
          done
          [ "$found" = "1" ] || { echo "No MP4 produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 14

  # 3 ─ Collect every MP4 into one artifact + one GitHub Release.
  publish:
    name: Publish
    needs: [plan, render]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: videos
          merge-multiple: true

      - name: List
        run: ls -lh videos

      - name: Bundle all MP4s
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos-${{ github.run_number }}
          path: videos/*.mp4
          retention-days: 30

      - name: Create GitHub Release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="render-${GITHUB_RUN_NUMBER}"
          {
            echo "Rendered from \`${GITHUB_SHA:0:7}\` (${GITHUB_EVENT_NAME})."
            echo ""
            echo "**1080 × 1920 · 60 fps · 25 s · H.264 (yuv420p)**"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in videos/*.mp4; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo ""
            echo "Download from **Assets** below."
          } > RELEASE_NOTES.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" videos/*.mp4 --clobber
          else
            gh release create "$TAG" videos/*.mp4 \
              --title "Rendered videos $TAG" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
