<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفاء — قوليها طبيعي · حلقة 19</title>
<style>
:root {
  --cream: #fff8f4;
  --pink: #e7a8b8;
  --rose: #c87991;
  --plum: #503747;
  --butter: #f6dfaa;
  --sage: #a8b8a2;
  --soft: #806d78;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f0e4e5;
  font-family: Tahoma, Arial, sans-serif;
  color: var(--plum);
}

.reel {
  width: min(100vw, 56.25vh);
  height: min(177.7778vw, 100vh);
  aspect-ratio: 9 / 16;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(
      circle at 100% 10%,
      #f8e3e9 0 16%,
      transparent 16.5%
    ),
    radial-gradient(
      circle at 0% 90%,
      #f9edcf 0 17%,
      transparent 17.5%
    ),
    var(--cream);
}

.header {
  position: absolute;
  top: 5%;
  left: 7%;
  right: 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-size: 18px;
  font-weight: 900;
}

.brand small {
  display: block;
  margin-top: 3px;
  color: var(--soft);
  font-size: 8px;
  letter-spacing: 2px;
  direction: ltr;
}

.episode {
  font-size: 10px;
  border: 1px solid #e6d5db;
  border-radius: 30px;
  padding: 8px 11px;
  background: #fffdfb;
}

.progress {
  position: absolute;
  top: 11%;
  left: 7%;
  right: 7%;
  display: flex;
  gap: 4px;
  direction: ltr;
}

.progress span {
  height: 3px;
  background: #eadde2;
  flex: 1;
  border-radius: 10px;
}

.progress span.active {
  background: var(--rose);
}

.stage {
  position: absolute;
  inset: 16% 7% 14%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.scene {
  width: 100%;
  animation: enter .6s ease both;
}

@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.tag {
  display: inline-block;
  background: #f7e6eb;
  color: #986276;
  padding: 9px 14px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 24px;
}

h1, h2, p { margin: 0; }

.title {
  font-size: clamp(30px, 7.3vw, 46px);
  line-height: 1.45;
  font-weight: 900;
  letter-spacing: -.5px;
}

.pink { color: var(--rose); }

.subtitle {
  margin-top: 15px;
  color: var(--soft);
  font-size: 16px;
  line-height: 1.9;
}

.card {
  position: relative;
  padding: 30px 20px;
  width: 100%;
  background: #fffdfb;
  border: 1px solid #f0e5e8;
  border-radius: 26px;
  box-shadow: 0 14px 32px #6645580d;
  direction: ltr;
}

.card::before {
  content: "";
  position: absolute;
  top: -8px;
  right: 25px;
  width: 48px;
  height: 16px;
  border-radius: 3px;
  transform: rotate(5deg);
  background: var(--butter);
}

.label {
  font-size: 10px;
  letter-spacing: 2px;
  color: #a07b8a;
  font-weight: bold;
  margin-bottom: 15px;
}

.old {
  color: #b6a4ad;
  text-decoration: line-through;
  text-decoration-color: var(--rose);
  text-decoration-thickness: 3px;
  font-size: clamp(20px, 5vw, 30px);
  font-weight: 900;
}

.english {
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: clamp(18px, 4.5vw, 25px);
  line-height: 1.4;
  font-weight: 900;
  color: var(--plum);
}

.translation {
  color: var(--soft);
  font-size: 15px;
  line-height: 1.9;
  margin-top: 17px;
}

.parts {
  display: grid;
  gap: 9px;
  direction: ltr;
  margin-top: 20px;
}

.part {
  text-align: left;
  padding: 13px 15px;
  border-radius: 14px;
  background: #fffdfb;
  border: 1px solid #eee1e6;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-weight: bold;
}

.part:nth-child(2) {
  background: #f8e8ed;
}

.repeat {
  background: #f8e8ed;
  border-radius: 24px;
  padding: 24px 18px;
  margin-top: 18px;
}

.cta {
  display: inline-block;
  background: var(--plum);
  color: var(--cream);
  padding: 13px 20px;
  border-radius: 30px;
  margin-top: 18px;
  font-size: 13px;
  font-weight: bold;
}

.footer {
  position: absolute;
  bottom: 5%;
  left: 7%;
  right: 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #9b8790;
  font-size: 10px;
  font-weight: bold;
}

.handle {
  direction: ltr;
  letter-spacing: .5px;
}

@media (prefers-reduced-motion: reduce) {
  .scene { animation: none; }
}
</style>
</head>

<body>
<main class="reel">

  <header class="header">
    <div class="brand">
      صفاء ✿
      <small>ENGLISH, EVERYDAY</small>
    </div>
    <div class="episode">قوليها طبيعي · 19</div>
  </header>

  <div class="progress" id="progress">
    <span></span><span></span><span></span>
    <span></span><span></span>
  </div>

  <section class="stage" id="stage"></section>

  <footer class="footer">
    <span>جملة صغيرة، فرق كبير ✿</span>
    <span class="handle">@SAFAA.ENGLISH</span>
  </footer>

</main>

<script>
const scenes = [

`<div class="scene">
  <div class="tag">✿ حلقة ١٩ · قوليها طبيعي</div>
  <h1 class="title">
    بمطعم فخم؟
    <br>
    <span class="pink">اسألي برقي</span>
  </h1>
  <p class="subtitle">
    اطلبي الدلالة على المغاسل
    <br>
    بأسلوب يوافق إتيكيت الأماكن الراقية.
  </p>
</div>`,

`<div class="scene">
  <p class="pink" style="margin-bottom:18px;font-weight:bold">
    بدل السؤال المباشر…
  </p>
  <div class="card">
    <div class="label">YOU MIGHT SAY</div>
    <div class="old">WHERE IS TOILET?</div>
  </div>
  <p class="subtitle">
    اللفظ المباشر يبان ناشف شوية،
    <br>
    وما يناسب الأماكن الهادية والفخمة.
  </p>
</div>`,

`<div class="scene">
  <div class="tag">✿ جرّبي هالجملة</div>
  <div class="card">
    <div class="label">SAY THIS INSTEAD</div>
    <div class="english">
      Could you point
      <br>
      me to the
      <br>
      restroom, please?
    </div>
  </div>
  <p class="translation">
    يعني: ممكن تدلني على دورات المياه لو سمحت؟
  </p>
</div>`,

`<div class="scene">
  <p class="pink" style="margin-bottom:15px;font-weight:bold">
    خلّينا نقسمها سوا
  </p>
  <h2 class="title" style="font-size:34px">
    جزّئيها…
    <span class="pink">ثم قوليها</span>
  </h2>
  <div class="parts">
    <div class="part">Could you point me</div>
    <div class="part">to the restroom, please?</div>
  </div>
  <p class="translation">
    قمة اللباقة والذوق بالتعامل.
  </p>
</div>`,

`<div class="scene">
  <div class="tag">✿ دورك الحين</div>
  <h2 class="title" style="font-size:36px">
    ردّديها معي
    <br>
    <span class="pink">مرة ثانية</span>
  </h2>
  <div class="repeat">
    <div class="english">
      Could you point me to the restroom, please?
    </div>
    <p class="translation">
      ممكن تدلني على دورات المياه لو سمحت؟
    </p>
  </div>
  <div class="cta">احفظيها لوقت تحتاجينها ♡</div>
  <p class="translation" style="font-size:12px">
    الحلقة الجاية: كيف تشكرين شخص عزمك بلطافة؟
  </p>
</div>`

];

const stage = document.getElementById("stage");
const bars = [...document.querySelectorAll("#progress span")];
const DURATION = 4400;

function showScene(index) {
  stage.innerHTML = scenes[index];

  bars.forEach((bar, i) => {
    bar.classList.toggle("active", i === index);
    if (i < index) bar.style.background = "#c87991";
    else bar.style.background = i === index ? "#c87991" : "#eadde2";
  });

  if (index < scenes.length - 1) {
    setTimeout(() => showScene(index + 1), DURATION);
  }
}

showScene(0);
</script>
</body>
</html>
