<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yezen Design - Architectural Motion</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #B8C4CE;
      font-family: 'Alexandria', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .editorial {
      font-family: 'Marcellus', serif;
    }

    /* خلفية الرمادي الفاتح المائل للزرقة المعماري */
    .slate-blueprint {
      background: #E2E8F0;
      background: radial-gradient(circle at 50% 35%, #EDF2F7 0%, #E2E8F0 60%, #CBD5E1 100%);
    }

    .grid-pattern {
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(71, 85, 105, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(71, 85, 105, 0.06) 1px, transparent 1px);
    }

    /* أنيميشن انسيابي محدد المدة */
    @keyframes smoothEnter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes portalGrow {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes truckLoop {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .anim-enter {
      animation: smoothEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .anim-portal {
      animation: portalGrow 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .flow-truck {
      stroke-dasharray: 140 160;
      animation: truckLoop 4s linear infinite;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ArchitecturalShowcase = () => {
      const [scene, setScene] = useState(0);

      useEffect(() => {
        const timer = setInterval(() => {
          setScene((prev) => (prev + 1) % 4);
        }, 7000);
        return () => clearInterval(timer);
      }, []);

      return (
        <div className="relative w-[390px] h-[844px] slate-blueprint grid-pattern rounded-[2.5rem] overflow-hidden flex flex-col justify-between p-7 select-none border border-slate-300 shadow-2xl text-slate-800">
          
          {/* رأس الكادر */}
          <header className="relative z-20 flex justify-between items-center border-b border-slate-300/80 pb-3.5">
            <div className="flex flex-col">
              <span className="text-sm font-semibold tracking-wide text-slate-900 leading-tight">
                يزن ديزاين
              </span>
              <span className="text-[10px] editorial tracking-[0.2em] text-slate-500 font-medium">
                Yezen Design
              </span>
            </div>

            <div className="text-[11px] text-slate-700 font-normal tracking-wide bg-white/70 px-3 py-1 rounded-full border border-slate-300 shadow-sm">
              @yezen_design
            </div>
          </header>

          {/* المسرح البصري المركزي الرئيسي */}
          <main className="relative z-10 flex-1 flex flex-col items-center justify-center">
            
            {/* المشهد 01: ترسيم مساحة الـ 21 دونماً */}
            {scene === 0 && (
              <div className="w-full flex flex-col items-center text-center anim-portal">
                <div className="relative w-64 h-64 flex items-center justify-center mb-6">
                  {/* خطوط كاد متجهة */}
                  <svg className="absolute inset-0 w-full h-full overflow-visible" viewBox="0 0 256 256">
                    <rect x="24" y="24" width="208" height="208" fill="rgba(255,255,255,0.4)" stroke="#94A3B8" strokeWidth="1" strokeDasharray="4 4" />
                    <rect x="36" y="36" width="184" height="184" fill="none" stroke="#334155" strokeWidth="1.2" />
                    <line x1="36" y1="128" x2="220" y2="128" stroke="#94A3B8" strokeWidth="0.8" strokeDasharray="2 3" />
                    <line x1="128" y1="36" x2="128" y2="220" stroke="#94A3B8" strokeWidth="0.8" strokeDasharray="2 3" />
                    
                    {/* صلبان الزوايا */}
                    <path d="M 18 24 L 30 24 M 24 18 L 24 30" stroke="#0F172A" strokeWidth="1.2" />
                    <path d="M 226 24 L 238 24 M 232 18 L 232 30" stroke="#0F172A" strokeWidth="1.2" />
                    <path d="M 18 232 L 30 232 M 24 226 L 24 238" stroke="#0F172A" strokeWidth="1.2" />
                    <path d="M 226 232 L 238 232 M 232 226 L 232 238" stroke="#0F172A" strokeWidth="1.2" />
                  </svg>

                  {/* كتلة القراءة المركزية المعزولة */}
                  <div className="relative z-10 w-24 h-24 rounded-full bg-white border border-slate-900 shadow-md flex flex-col items-center justify-center">
                    <span className="editorial text-3xl font-semibold text-slate-900 leading-none">21</span>
                    <span className="text-[10px] font-medium text-slate-600 mt-1">دونم صناعي</span>
                  </div>
                </div>

                <h2 className="text-lg font-semibold text-slate-900 tracking-wide mb-1">
                  تأسيس المنظومة الصناعية
                </h2>
                <p className="text-xs text-slate-600 font-normal max-w-[270px] leading-relaxed">
                  على مساحة تتجاوز 21 دونماً.. تطويع المساحة وفق أعلى معايير الاستثمار
                </p>
              </div>
            )}

            {/* المشهد 02: المنظومة الثلاثية الموزونة تماماً وبدون أي تداخل */}
            {scene === 1 && (
              <div className="w-full flex flex-col items-center text-center anim-enter">
                <div className="relative w-72 h-64 mb-6">
                  {/* خطوط ربط المخطط بالخلفية */}
                  <svg className="absolute inset-0 w-full h-full" viewBox="0 0 288 256">
                    <line x1="144" y1="46" x2="64" y2="195" stroke="#94A3B8" strokeWidth="1.2" strokeDasharray="4 4" />
                    <line x1="144" y1="46" x2="224" y2="195" stroke="#94A3B8" strokeWidth="1.2" strokeDasharray="4 4" />
                    <line x1="64" y1="195" x2="224" y2="195" stroke="#94A3B8" strokeWidth="1.2" strokeDasharray="4 4" />
                    <circle cx="144" cy="145" r="5" fill="#0F172A" />
                    <circle cx="144" cy="145" r="14" fill="none" stroke="#94A3B8" strokeWidth="0.8" strokeDasharray="2 3" />
                  </svg>

                  {/* 1. مبنى الإدارة (في الأعلى - رأس الهرم والمدخل) */}
                  <div className="absolute top-2 left-1/2 -translate-x-1/2 w-28 py-2 bg-white rounded-lg border border-slate-700 shadow-sm flex flex-col items-center">
                    <span className="text-xs font-semibold text-slate-900">الإدارة</span>
                    <span className="editorial text-[8px] text-slate-500 tracking-wider">ADMIN HQ</span>
                  </div>

                  {/* 2. خطوط الإنتاج (اليمين المعماري - قلب التشغيل) */}
                  <div className="absolute bottom-3 right-2 w-28 py-2 bg-white rounded-lg border-2 border-slate-900 shadow-sm flex flex-col items-center">
                    <span className="text-xs font-bold text-slate-900">الإنتاج</span>
                    <span className="editorial text-[8px] text-slate-600 tracking-wider">PRODUCTION</span>
                  </div>

                  {/* 3. التخزين اللوجستي (اليسار المعماري المقابل) */}
                  <div className="absolute bottom-3 left-2 w-28 py-2 bg-white rounded-lg border border-slate-700 shadow-sm flex flex-col items-center">
                    <span className="text-xs font-semibold text-slate-900">التخزين</span>
                    <span className="editorial text-[8px] text-slate-500 tracking-wider">LOGISTICS</span>
                  </div>
                </div>

                <h2 className="text-lg font-semibold text-slate-900 tracking-wide mb-1">
                  تكامل المنظومة الثلاثية
                </h2>
                <p className="text-xs text-slate-600 font-normal max-w-[270px] leading-relaxed">
                  ربط ذكي ومباشر يوحد خطوط الإنتاج بالمستودعات ومبنى الإدارة
                </p>
              </div>
            )}

            {/* المشهد 03: انسيابية الحركة اللوجستية */}
            {scene === 2 && (
              <div className="w-full flex flex-col items-center text-center anim-enter">
                <div className="relative w-64 h-64 flex items-center justify-center mb-6">
                  <svg className="absolute inset-0 w-full h-full" viewBox="0 0 256 256">
                    {/* مضمار الحركة العريض */}
                    <rect x="28" y="44" width="200" height="168" rx="84" fill="none" stroke="#CBD5E1" strokeWidth="20" />
                    <rect x="28" y="44" width="200" height="168" rx="84" fill="none" stroke="#334155" strokeWidth="1.5" className="flow-truck" />
                    <circle cx="128" cy="44" r="4" fill="#0F172A" />
                    <circle cx="128" cy="212" r="4" fill="#64748B" />
                  </svg>

                  {/* رصيف الشحن والتفريغ في المنتصف */}
                  <div className="relative z-10 px-4 py-2 bg-white border border-slate-900 rounded-lg shadow-sm flex flex-col items-center">
                    <span className="text-xs font-bold text-slate-900">منطقة التفريغ</span>
                    <span className="editorial text-[8px] text-slate-500 tracking-wider">ZERO FRICTION</span>
                  </div>
                </div>

                <h2 className="text-lg font-semibold text-slate-900 tracking-wide mb-1">
                  انسيابية الحركة والتشغيل
                </h2>
                <p className="text-xs text-slate-600 font-normal max-w-[270px] leading-relaxed">
                  مسارات مخصصة لحركة النقل الثقيل تضمن استمرار العمل دون عوائق
                </p>
              </div>
            )}

            {/* المشهد 04: إطار فارغ تماماً 100% لإسقاط الشعار بالمونتاج */}
            {scene === 3 && (
              <div className="w-full flex flex-col items-center text-center anim-enter">
                <div className="relative w-64 h-64 flex items-center justify-center mb-6">
                  <svg className="w-full h-full overflow-visible" viewBox="0 0 256 256">
                    {/* إطار دائري رقيق محيط بالمركز */}
                    <circle cx="128" cy="128" r="68" fill="none" stroke="#94A3B8" strokeWidth="0.9" strokeDasharray="4 5" />
                    
                    {/* علامات ضبط الارتكاز المركزية الأربعة لإرشاد المونتاج */}
                    <line x1="128" y1="46" x2="128" y2="56" stroke="#0F172A" strokeWidth="1.2" />
                    <line x1="128" y1="200" x2="128" y2="210" stroke="#0F172A" strokeWidth="1.2" />
                    <line x1="46" y1="128" x2="56" y2="128" stroke="#0F172A" strokeWidth="1.2" />
                    <line x1="200" y1="128" x2="210" y2="128" stroke="#0F172A" strokeWidth="1.2" />
                  </svg>
                  {/* الدائرة فارغة تماماً ولا تحتوي على أي عنصر داخلها */}
                </div>

                <h2 className="text-lg font-semibold text-slate-900 tracking-wide mb-1">
                  من المخطط إلى الواقع
                </h2>
                <p className="text-xs text-slate-600 font-normal max-w-[270px] leading-relaxed">
                  حين تتجسد الرؤية الهندسية المتكاملة على أرض الواقع
                </p>
              </div>
            )}

          </main>

          {/* التذييل وأشرطة التنقل المباشر */}
          <footer className="relative z-20 border-t border-slate-300/80 pt-3.5 flex flex-col gap-2">
            <div className="flex justify-between items-center text-[10px] text-slate-500 font-medium">
              <span>بغداد، العراق</span>
              <span className="editorial tracking-wider text-slate-600 font-semibold">PORTFOLIO REEL</span>
            </div>

            <div className="grid grid-cols-4 gap-2">
              {[0, 1, 2, 3].map((idx) => (
                <div
                  key={idx}
                  onClick={() => setScene(idx)}
                  className="h-[3px] bg-slate-300 rounded-full overflow-hidden cursor-pointer"
                >
                  <div
                    className={`h-full bg-slate-800 transition-all duration-500 ease-out ${
                      scene === idx ? "w-full" : scene > idx ? "w-full opacity-40" : "w-0"
                    }`}
                  />
                </div>
              ))}
            </div>
          </footer>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ArchitecturalShowcase />);
  </script>
</body>
</html>
