<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f5">
<title>صفاء | قوليها طبيعي — الحلقة 01</title>
<style>
  :root {
    --cream: #fff8f4;
    --pink: #e7a8b8;
    --pink-deep: #c87991;
    --plum: #503747;
    --butter: #f6dfaa;
    --sage: #a8b8a2;
    --ink-soft: #806d78;
    --paper: #fffdfb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #f0e4e5; }
  body {
    display: grid;
    place-items: center;
    font-family: Tahoma, Arial, sans-serif;
    color: var(--plum);
    overflow: hidden;
  }
  .reel {
    position: relative;
    width: min(100vw, 56.25vh);
    height: min(177.7778vw, 100vh);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    isolation: isolate;
    background: var(--cream);
  }
  .wash {
    position: absolute;
    z-index: -2;
    inset: 0;
    background:
      radial-gradient(ellipse at 100% 9%, rgba(231,168,184,.22) 0 17%, transparent 17.5%),
      radial-gradient(ellipse at 3% 86%, rgba(246,223,170,.34) 0 18%, transparent 18.5%),
      var(--cream);
  }
  .grain {
    position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .18;
    background-image: radial-gradient(#c9a7b1 .6px, transparent .6px);
    background-size: 8px 8px;
  }
  .top {
    position: absolute; top: 5.2%; left: 7%; right: 7%;
    display: flex; align-items: center; justify-content: space-between;
    direction: ltr;
  }
  .brand { display: flex; gap: 8px; align-items: center; direction: rtl; }
  .flower-mark { width: 28px; height: 28px; flex: 0 0 auto; }
  .brand-copy { display: grid; gap: 1px; }
  .brand-name { font-size: 15px; font-weight: 800; letter-spacing: -.3px; }
  .brand-sub { font-size: 8px; letter-spacing: 1.2px; color: var(--ink-soft); direction: ltr; }
  .episode-pill {
    border: 1px solid rgba(80,55,71,.16); border-radius: 999px; padding: 7px 10px;
    color: var(--ink-soft); background: rgba(255,253,251,.72); font-size: 10px; font-weight: 700;
  }
  .progress { position: absolute; top: 10.5%; left: 7%; right: 7%; display: flex; gap: 4px; direction: ltr; }
  .progress span { height: 3px; flex: 1; border-radius: 99px; background: rgba(80,55,71,.12); overflow: hidden; }
  .progress span i { display:block; height:100%; width:0; border-radius:99px; background:var(--pink-deep); }
  .progress span.done i { width:100%; }
  .progress span.active i { width:100%; transition: width 4.4s linear; }
  .stage {
    position: absolute; left: 7%; right: 7%; top: 16%; bottom: 14%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 18px;
  }
  .scene { width: 100%; animation: arrive .65s cubic-bezier(.2,.75,.25,1) both; }
  @keyframes arrive { from { opacity:0; transform: translateY(15px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 7px; border-radius: 999px;
    padding: 8px 13px; background: #f7e6eb; color: #986276; font-size: 11px; font-weight: 800;
    margin-bottom: 22px;
  }
  .mini-flower { color: var(--pink-deep); font-size: 15px; line-height: 1; }
  h1, h2, p { margin: 0; }
  .headline { font-size: clamp(30px, 7.3vw, 47px); line-height: 1.42; font-weight: 900; letter-spacing: -.8px; }
  .headline .pink { color: var(--pink-deep); }
  .subline { font-size: clamp(15px, 3.7vw, 20px); line-height: 1.8; color: var(--ink-soft); margin-top: 14px; font-weight: 500; }
  .english-card {
    position: relative; width: 100%; border-radius: 27px; padding: 27px 20px 24px;
    background: var(--paper); border: 1px solid rgba(80,55,71,.08);
    box-shadow: 0 14px 32px rgba(102,69,88,.075); direction: ltr;
  }
  .english-card:before {
    content: ''; position:absolute; top:-8px; right:24px; width:48px; height:17px;
    background:rgba(246,223,170,.88); transform:rotate(5deg); border-radius:3px;
  }
  .small-label { color: #a07b8a; font-weight: 800; font-size: 10px; letter-spacing: 2px; margin-bottom: 14px; }
  .bad-phrase { font-size: clamp(35px, 9vw, 56px); font-weight: 900; color: #b6a4ad; text-decoration: line-through; text-decoration-color: var(--pink-deep); text-decoration-thickness: 3px; }
  .good-phrase { font-family: 'Trebuchet MS', Tahoma, Arial, sans-serif; font-size: clamp(24px, 6vw, 35px); line-height: 1.35; font-weight: 800; color: var(--plum); }
  .translation { font-size: 16px; line-height: 1.8; color: var(--ink-soft); margin-top: 16px; }
  .note {
    display: inline-flex; align-items: center; gap: 8px; background: #f9eddd; color: #8b6c55;
    border-radius: 13px; padding: 10px 13px; font-size: 12px; font-weight: 700; line-height:1.5;
  }
  .split-list { display: grid; gap: 9px; direction: ltr; margin-top: 17px; }
  .split { background: #fffdfb; border: 1px solid rgba(80,55,71,.09); border-radius: 15px; padding: 11px 15px; text-align: left; font: 700 16px 'Trebuchet MS', Tahoma, Arial, sans-serif; }
  .split:nth-child(2) { background: #f8e8ed; border-color: transparent; }
  .repeat-card { background: #f8e8ed; border-radius: 24px; padding: 25px 19px; margin-top: 18px; }
  .repeat-card .good-phrase { font-size: clamp(23px, 5.8vw, 32px); }
  .arabic-note { font-size: 14px; color: var(--ink-soft); line-height: 1.8; margin-top: 13px; }
  .footer {
    position:absolute; bottom:5%; left:7%; right:7%; display:flex; justify-content:space-between; align-items:center;
    color:#9b8790; font-size:10px; font-weight:700;
  }
  .footer .handle { direction:ltr; letter-spacing:.5px; }
  .doodle { position:absolute; pointer-events:none; opacity:.9; }
  .doodle.one { left:6%; top:26%; transform:rotate(-11deg); }
  .doodle.two { right:7%; bottom:25%; transform:rotate(12deg); }
  .caption-label { color: var(--pink-deep); font-size: 12px; font-weight: 800; letter-spacing: .6px; margin-bottom: 9px; }
  .cta { display:inline-block; border-radius:999px; padding:13px 19px; margin-top:18px; background:var(--plum); color:#fff8f4; font-size:13px; font-weight:800; }
  .final-title { font-size: clamp(29px, 7vw, 43px); line-height:1.45; font-weight:900; }
  .final-title span { color:var(--pink-deep); }
  @media (prefers-reduced-motion: reduce) { .scene { animation:none; } .progress span.active i { transition:none; } }
</style>
</head>
<body>
<main class="reel" aria-label="فيديو صفاء: قوليها طبيعي — الحلقة الأولى">
  <div class="wash"></div><div class="grain"></div>
  <div class="top">
    <div class="brand">
      <svg class="flower-mark" viewBox="0 0 40 40" aria-hidden="true">
        <g fill="#e7a8b8" stroke="#c87991" stroke-width=".8">
          <ellipse cx="20" cy="9" rx="5" ry="8"/><ellipse cx="20" cy="31" rx="5" ry="8"/>
          <ellipse cx="9" cy="20" rx="8" ry="5"/><ellipse cx="31" cy="20" rx="8" ry="5"/>
          <ellipse cx="12.2" cy="12.2" rx="5" ry="7" transform="rotate(-45 12.2 12.2)"/>
          <ellipse cx="27.8" cy="27.8" rx="5" ry="7" transform="rotate(-45 27.8 27.8)"/>
          <ellipse cx="27.8" cy="12.2" rx="5" ry="7" transform="rotate(45 27.8 12.2)"/>
          <ellipse cx="12.2" cy="27.8" rx="5" ry="7" transform="rotate(45 12.2 27.8)"/>
        </g><circle cx="20" cy="20" r="4.3" fill="#f6dfaa" stroke="#c87991" stroke-width=".8"/>
      </svg>
      <div class="brand-copy"><div class="brand-name">صفاء</div><div class="brand-sub">ENGLISH, EVERYDAY</div></div>
    </div>
    <div class="episode-pill">قوليها طبيعي · 01</div>
  </div>
  <div class="progress" id="progress"><span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span></div>
  <svg class="doodle one" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 L27 17 L40 10 L31 22 L45 26 L30 29 L37 43 L25 33 L18 46 L18 31 L4 36 L14 25 L2 17 L18 19 Z" fill="#f6dfaa" stroke="#ddb878" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <svg class="doodle two" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 C28 14 34 17 45 19 C34 23 29 29 27 44 C22 32 16 26 3 24 C15 21 21 15 24 3Z" fill="#e7a8b8" opacity=".7"/></svg>
  <section class="stage" id="stage" aria-live="polite"></section>
  <div class="footer"><span>جملة صغيرة، فرق كبير ✿</span><span class="handle">@SAFAA.ENGLISH</span></div>
</main>
<script>
  const scenes = [
    `<div class="scene"><div class="eyebrow"><span class="mini-flower">✿</span> حلقة ١ · قوليها طبيعي</div><h1 class="headline">ما سمعتي الكلام زين؟<br><span class="pink">خلّينا نردّ بلطف</span></h1><p class="subline">جملة إنجليزية صغيرة<br>تنفعك بمواقف كثيرة.</p><div style="margin-top:25px;font-size:35px;color:#c87991">✿ ✦ ✿</div></div>`,
    `<div class="scene"><div class="caption-label">بدل هالردّ السريع…</div><div class="english-card"><div class="small-label">YOU MIGHT SAY</div><div class="bad-phrase">WHAT?</div></div><p class="subline">كلمة “What?” مو غلط دائماً،<br>بس ممكن تبان حادّة حسب النبرة.</p></div>`,
    `<div class="scene"><div class="eyebrow"><span class="mini-flower">✿</span> جرّبي هالجملة</div><div class="english-card"><div class="small-label">SAY THIS INSTEAD</div><div class="good-phrase">Sorry,<br>could you say that<br>again, please?</div></div><p class="translation">يعني: عذراً، ممكن تعيد كلامك لو سمحت؟</p></div>`,
    `<div class="scene"><div class="caption-label">خلّينا نقسمها سوا</div><h2 class="headline" style="font-size:clamp(27px,6.5vw,40px)">جزّئيها…<span class="pink"> ثم قوليها</span></h2><div class="split-list"><div class="split">Sorry,</div><div class="split">could you say that again,</div><div class="split">please?</div></div><p class="translation">خذي نفس، وقوليها بهدوء وبابتسامة.</p></div>`,
    `<div class="scene"><div class="eyebrow"><span class="mini-flower">✿</span> دورك الحين</div><h2 class="final-title">ردّديها معي<br><span>مرة ثانية</span></h2><div class="repeat-card"><div class="good-phrase">Sorry, could you say that again, please?</div><div class="arabic-note">عذراً، ممكن تعيد كلامك لو سمحت؟</div></div><div class="cta">احفظيها لوقت تحتاجينها ♡</div><p class="translation" style="font-size:12px;margin-top:12px">الحلقة الجاية: كيف تطلبين المساعدة؟</p></div>`
  ];
  const stage = document.getElementById('stage');
  const bars = [...document.querySelectorAll('.progress span')];
  const DURATION = 4400;
  let current = 0;
  function renderScene(index) {
    current = index;
    stage.innerHTML = scenes[index];
    bars.forEach((bar, i) => {
      bar.classList.remove('active', 'done');
      const fill = bar.querySelector('i');
      fill.style.transition = 'none';
      fill.style.width = i < index ? '100%' : '0%';
      if (i < index) bar.classList.add('done');
    });
    const activeFill = bars[index].querySelector('i');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bars[index].classList.add('active');
      activeFill.style.transition = `width ${DURATION}ms linear`;
      activeFill.style.width = '100%';
    }));
    if (index < scenes.length - 1) {
      window.setTimeout(() => renderScene(index + 1), DURATION);
    }
  }
  renderScene(0);
</script>
</body>
</html>
